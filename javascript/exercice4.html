     Heure <input type="number" id="h3">
   minute <input type="number" id="m3">

    <script>
        function calculerSomme(){
        let h1=Number(document.getElementById('h1').value);
        let m1=Number(document.getElementById('m1').value);
        let s1=Number(document.getElementById('s1').value);

         let h2=Number(document.getElementById('h2').value);
        let m2=Number(document.getElementById('m2').value);
        let s2=Number(document.getElementById('s2').value);

         let h3=Number(document.getElementById('h3').value);
        let m3=Number(document.getElementById('m3').value);
        let s3=Number(document.getElementById('s3').value);

        let totH= h1+h2+h3;
        let totM= m1+m2+m3;
        let totS=s1+s2+s3;

        let SommeSeconde= (totH*3600)+(totM*60)+totS;
        

        let seconde=SommeSeconde % 60;
        let MINUTE=Math.floor(SommeSeconde / 60);

        let minute=MINUTE % 60;
        let HEURE= Math.floor(MINUTE / 60);

        let heure=HEURE % 24;
        let jour=Math.floor(HEURE / 24);

        

    document.getElementById('S').value=seconde;
    document.getElementById('M').value=minute;
    document.getElementById('H').value=heure;
    document.getElementById('J').value=jour;

        }

            document.getElementById('j').value = '';

        }
        
    </script>
